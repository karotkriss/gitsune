<!-- @dsCard group="Type" viewport="700x240" name="Monospace rule" subtitle="GitLab Mono for every git reference — hard token-level rule" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:flex;flex-direction:column;gap:10px}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--gs-token-bg);border-radius:var(--gl-border-radius-md);padding:3px 8px;font:var(--gs-text-mono)}.lbl{font-size:11px;color:var(--gl-text-color-subtle);width:110px;flex:none}.r{display:flex;align-items:center;gap:12px}</style></head><body>
<div class="r"><span class="lbl">Branch</span><span class="chip">feat/instance-switcher</span><span class="chip">main</span></div>
<div class="r"><span class="lbl">Commit</span><span class="chip">a15f9ff5</span><span style="font:var(--gs-text-mono);color:var(--gl-text-color-subtle)">Merge branch 'fix/oauth-pkce' into 'main'</span></div>
<div class="r"><span class="lbl">Pipeline</span><span class="chip">#88123</span><span class="chip">!142</span><span class="chip">#4103</span></div>
<div class="r"><span class="lbl">Code</span><pre style="margin:0;background:var(--gs-code-bg);border-radius:var(--gl-border-radius-lg);padding:10px 12px;font:var(--gs-text-mono)"><span style="color:var(--gs-code-keyword)">final</span> <span style="color:var(--gs-code-function)">client</span> = GitlabClient(instance: <span style="color:var(--gs-code-string)">'gitlab.com'</span>);</pre></div>
<div style="font-size:12px;color:var(--gl-text-color-subtle)">Branch names, commit IDs, MR/issue numbers, pipeline IDs, and code are always GitLab Mono — never the UI face.</div>
</body></html>
