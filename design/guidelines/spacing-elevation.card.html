<!-- @dsCard group="Spacing" viewport="700x230" name="Elevation, focus & touch" subtitle="Quiet gray shadows · 2px blue focus ring · 44pt targets" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 16px;background:var(--gl-background-color-subtle);display:flex;gap:18px;align-items:flex-start}.sh{width:104px;height:72px;background:var(--gs-surface-card);border-radius:12px;display:flex;align-items:center;justify-content:center;font:10px/1 var(--gs-font-mono);color:var(--gl-text-color-subtle)}.cap{font:10px/14px var(--gs-font-mono);color:var(--gl-text-color-subtle);text-align:center;margin-top:8px}</style></head><body>
<div><div class="sh" style="box-shadow:var(--gl-shadow-sm)">sm</div><div class="cap">cards at rest</div></div>
<div><div class="sh" style="box-shadow:var(--gl-shadow-md)">md</div><div class="cap">toasts · popovers</div></div>
<div><div class="sh" style="box-shadow:var(--gl-shadow-lg)">lg</div><div class="cap">sheets · modals</div></div>
<div><button style="height:44px;padding:0 16px;border:none;border-radius:4px;background:var(--gs-action-color);color:#fff;font:600 14px var(--gs-font-ui);box-shadow:var(--gs-focus-ring)">Continue</button><div class="cap">:focus-visible ring</div></div>
<div><div style="position:relative;width:44px;height:44px;border:1px dashed var(--gl-color-blue-400);border-radius:8px;display:flex;align-items:center;justify-content:center"><span style="width:20px;height:20px;border-radius:4px;background:var(--gl-color-blue-200)"></span></div><div class="cap">20–24px glyph in<br>a 44pt target</div></div>
<div style="flex:1;font-size:12px;color:var(--gl-text-color-subtle);max-width:170px">Elevation is rare: flat surfaces + hairline borders by default; shadows only for things that float.</div>
</body></html>
