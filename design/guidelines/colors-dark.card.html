<!-- @dsCard group="Colors" viewport="700x250" name="Light & dark" subtitle="Dark-first — light supported; set data-theme on any subtree" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.demo{border-radius:12px;padding:14px;border:1px solid var(--gl-border-color-default);background:var(--gl-background-color-subtle)}
.card{background:var(--gs-surface-card);border:1px solid var(--gl-border-color-subtle);border-radius:12px;padding:12px 14px;margin-top:8px}
.t{font-weight:600;color:var(--gl-text-color-heading);font-size:14px}.s{color:var(--gl-text-color-subtle);font-size:12px;margin-top:2px}
.link{color:var(--gs-link-color);font-size:13px}.mono{font:11px/16px var(--gs-font-mono);color:var(--gl-text-color-subtle)}</style></head><body>
<div class="demo"><span class="mono">:root — light</span><div class="card"><div class="t">Add offline read cache</div><div class="s">gitsune/app <span style="font-family:var(--gs-font-mono)">!87</span> · updated 2h ago</div><a class="link" href="#" onclick="return false">View merge request</a></div></div>
<div class="demo" data-theme="dark"><span class="mono">[data-theme="dark"]</span><div class="card"><div class="t">Add offline read cache</div><div class="s">gitsune/app <span style="font-family:var(--gs-font-mono)">!87</span> · updated 2h ago</div><a class="link" href="#" onclick="return false">View merge request</a></div></div>
</body></html>
