<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel">
const { Icon, CiIcon } = window.GitsuneDesignSystem_6e1df4;
const ui = ['home','todo-done','compass','user','issues','merge-request','rocket','project','group','search','branch','commit','fork','comment','labels','milestone','epic','clock','check-circle','error','warning','notifications','settings','external-link','download','filter','sort-lowest','pencil','paper-airplane','eye','star-o','ellipsis_h'];
